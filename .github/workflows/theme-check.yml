name: Theme Check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    # The repo's default workflow token is read-only, so the action could not
    # create its check run and every push failed at "Creating GitHub check..."
    # with "Resource not accessible by integration" — after linting had already
    # passed. Grant the one extra scope here rather than loosening the
    # repo-wide default.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          base: main
          # Fail the build only on errors; warnings/suggestions are annotated but non-blocking.
          flags: '--fail-level error'
